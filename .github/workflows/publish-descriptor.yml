# Publie `this-descriptor` seul, sans attendre `this-rs`.
#
# Pourquoi un workflow séparé : `release.yml` publie `this-descriptor` COMME
# ÉTAPE de la publication de `this-rs`. Or `this-rs` 0.0.10 ne peut pas être
# publié aujourd'hui — ses six dépendances optionnelles `obrain-*` sont des
# chemins locaux que crates.io ne connaît pas (détaillé dans release.yml).
# Ce workflow débloque la première moitié sans exiger la seconde.
#
# `this-descriptor` est immuable sur crates.io : la v0.0.1 se publie une seule
# fois. Le déclencheur par tag ne sera donc poussé qu'une fois.

name: Publish this-descriptor

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Vérifier seulement (package + compile isolé), ne rien envoyer'
        type: boolean
        default: true
  push:
    tags:
      - 'descriptor-v*'

permissions:
  contents: read

jobs:
  publish-descriptor:
    name: Publish this-descriptor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Le manifest du workspace référence des path-deps optionnels (obrain-*,
      # this-vite, wami) que le runner n'a pas. cargo résout les path-deps même
      # non activés : sans stubs, le manifest ne charge pas (vu sur le premier
      # dry-run : « failed to load manifest for workspace member »).
      - name: Create local dep stubs
        run: bash .github/create-local-dep-stubs.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Vérifie TOUJOURS : `cargo publish --dry-run` empaquette puis recompile le
      # paquet hors de l'arborescence. Une version non publiable échoue ici,
      # avant tout envoi.
      - name: Verify package
        run: cargo publish -p this-descriptor --dry-run

      # N'envoie que sur un tag, ou sur dispatch explicite avec dry_run décoché.
      #
      # `!inputs.dry_run` et non `inputs.dry_run == 'false'` : un input typé
      # `boolean` est un BOOLÉEN, et le comparer à la chaîne 'false' est
      # toujours faux. Cette erreur a rendu un run vert alors que l'étape était
      # sautée — rien n'était publié et rien ne le signalait.
      - name: Publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: cargo publish -p this-descriptor --token "$CARGO_REGISTRY_TOKEN"

      # Une étape qui peut être sautée en silence doit être vérifiée après coup.
      # Sans ce contrôle, un `if:` faux laisse un run vert pour une publication
      # qui n'a pas eu lieu.
      - name: Confirm the version is live
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          V=$(cargo metadata --no-deps --format-version 1 \
                | jq -r '.packages[] | select(.name=="this-descriptor") | .version')
          for i in $(seq 1 24); do
            if curl -sf "https://crates.io/api/v1/crates/this-descriptor/$V" \
                 -A "this-rs-release" > /dev/null; then
              echo "this-descriptor $V is live on crates.io"
              exit 0
            fi
            sleep 10
          done
          echo "::error::this-descriptor $V was published but is NOT on crates.io"
          exit 1
