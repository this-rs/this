name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/*.mmd'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/*.mmd'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Test sur plusieurs versions de Rust
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    # Nightly is expected to be GREEN (see the feature set below). `continue-on-error`
    # stays: if a dependency we add later stops building on nightly, this leg must report
    # it without blocking a merge — stable and beta are the ones that decide a merge.
    # A red nightly leg therefore means "look at this", not "you cannot ship".
    continue-on-error: ${{ matrix.rust == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: stable
            features: all,wami
          - rust: beta
            features: all,wami
          # Nightly answers ONE question: does OUR code compile and pass on tomorrow's
          # compiler? It cannot answer the full-matrix question, because several third
          # party async crates do not build on it today:
          #   error[E0391]: cycle detected when computing when
          #     `dynamic::field::FieldValueInner` needs async drop   (async-graphql 7.2.1)
          #   error[E0391]: … when `error::Error` needs async drop     (mongodb)
          # Those are upstream and unrelated to this crate. Running them nightly kept a
          # check red on every single run — which is how a team learns to ignore red.
          # This set covers everything written here (storage core, websocket, push,
          # signed modules, OIDC, WAMI) and nothing that does not compile. If a real
          # nightly regression appears in our code, this leg goes red and says so.
          - rust: nightly
            features: in-memory,websocket,push,module-signing,oidc,wami
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create local dep stubs
        run: bash .github/create-local-dep-stubs.sh

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

      # Use --features all,wami (not --all-features) because obrain and
      # frontend depend on local path checkouts not available on CI.
      - name: Run unit tests
        run: cargo test --lib --features ${{ matrix.features }} --verbose

      - name: Run integration tests (sequential for DB isolation)
        run: cargo test --features ${{ matrix.features }} --test '*' -- --test-threads=1

      - name: Run doc tests
        run: cargo test --doc --features ${{ matrix.features }}

      # The scope fallback in `SurfaceGuard::with_env` and `Authorization::check_iam` only runs
      # when NO IAM plan is wired — which is exactly the shape of an OIDC resource server. The
      # `all,wami` build above never compiles that path, so a `cfg` mistake there stays green in
      # CI and breaks a real deployment (found on #92: `PermissionFn` was cfg-gated to
      # obrain/wami while the no-IAM branch used it unconditionally).
      # Stable only: the invariant is about feature gating, not about the compiler, and the
      # `graphql` half of this combination does not build on nightly (async-graphql, E0391).
      # Running it on every leg added a red check for a property already proven here once.
      - name: Check the surfaces with no IAM plan (the OIDC shape)
        if: matrix.rust == 'stable'
        run: cargo check --no-default-features --features graphql,grpc,websocket

      - name: Test this-descriptor (pure crate, every feature)
        run: cargo test -p this-descriptor --all-features

      - name: Check this-descriptor on wasm32 (no server dependency)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p this-descriptor --target wasm32-unknown-unknown
          cargo check -p this-descriptor --target wasm32-unknown-unknown --features yaml,pattern
          # The Leptos bridge (`impl FromServerFnError`) targets wasm32 on the client side.
          # `--all-features` above only proves it for the host toolchain.
          cargo check -p this-descriptor --target wasm32-unknown-unknown --features leptos

  # Code coverage
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create local dep stubs
        run: bash .github/create-local-dep-stubs.sh

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-

      # The container-backed tests pull their images at run time; a transient registry error
      # (measured: "bytes remaining on stream" on mongo:5.0.6) failed the whole job. Pull them
      # here with retries so the test run never depends on a single registry response.
      - name: Pre-pull test container images (retry on transient registry errors)
        run: |
          for img in cassandra:4.1 mongo:5.0.6 neo4j:5 postgres:11-alpine mysql:8.1; do
            for attempt in 1 2 3 4 5; do
              if docker pull --quiet "$img" >/dev/null; then break; fi
              echo "::warning::pull of $img failed (attempt $attempt), retrying"
              sleep $((attempt * 15))
              if [ "$attempt" = 5 ]; then echo "::error::cannot pull $img"; exit 1; fi
            done
          done

      - name: Generate code coverage
        run: cargo llvm-cov --features all,wami --workspace --lcov --output-path lcov.info -- --test-threads=1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Vérification du formatage
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        # rustfmt on the tracked files: `cargo fmt` runs `cargo metadata`, which loads
        # the optional obrain/vite-rs path dependencies (absent on the runner) once the
        # workspace declares members. Formatting is the same check.
        run: git ls-files '*.rs' | xargs rustfmt --edition 2024 --check

  # Clippy linting
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create local dep stubs
        run: bash .github/create-local-dep-stubs.sh

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy --all-targets --features all,wami -- -D warnings

  # Vérification de la compilation des exemples
  examples:
    name: Build Examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create local dep stubs
        run: bash .github/create-local-dep-stubs.sh

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-examples-${{ hashFiles('**/Cargo.lock') }}

      - name: Build simple_api example
        run: cargo build --example simple_api

      - name: Build microservice example
        run: cargo build --example microservice

      - name: Build full_api example
        run: cargo build --example full_api

  # Vérification de sécurité avec cargo-audit
  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create local dep stubs
        run: bash .github/create-local-dep-stubs.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        # Ignore known unfixable transitive advisories (all pending upstream fixes):
        # RUSTSEC-2023-0071: RSA Marvin Attack (rsa via sqlx-mysql)
        # RUSTSEC-2024-0384, 0436, 0449: transitive deps
        # RUSTSEC-2025-0012: backoff, 0111: tokio-tar, 0134, 0141: bincode
        # RUSTSEC-2026-0098, 0099, 0104, 0258, 0346, 0349, 0382: h2/rustls/rustls-webpki
        # RUSTSEC-2026-0387: crypto-bigint 0.5 (timing) via jsonwebtoken 10 → p256/p384,
        #   i.e. ECDSA paths; this-rs and wami sign/verify EdDSA only (ed25519-dalek).
        #   Fix is crypto-bigint >=0.7.6, not yet reachable from the p256 0.13 line.
        run: >-
          cargo audit
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2024-0384
          --ignore RUSTSEC-2024-0436
          --ignore RUSTSEC-2024-0449
          --ignore RUSTSEC-2025-0012
          --ignore RUSTSEC-2025-0111
          --ignore RUSTSEC-2025-0134
          --ignore RUSTSEC-2025-0141
          --ignore RUSTSEC-2026-0098
          --ignore RUSTSEC-2026-0099
          --ignore RUSTSEC-2026-0104
          --ignore RUSTSEC-2026-0258
          --ignore RUSTSEC-2026-0346
          --ignore RUSTSEC-2026-0349
          --ignore RUSTSEC-2026-0382
          --ignore RUSTSEC-2026-0387

  # Vérification de la documentation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create local dep stubs
        run: bash .github/create-local-dep-stubs.sh

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-docs-${{ hashFiles('**/Cargo.lock') }}

      - name: Check documentation
        run: cargo doc --no-deps --features all,wami
        env:
          RUSTDOCFLAGS: -D warnings

  # Vérification de la compilation sur différentes plateformes
  cross-platform:
    name: Cross Platform Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create local dep stubs
        run: bash .github/create-local-dep-stubs.sh
        shell: bash

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --features all,wami

      # Unit tests run on all platforms (no Docker needed).
      # Integration tests (testcontainers) only run on Linux where Docker is available.
      - name: Run unit tests
        run: cargo test --lib --features all,wami

      - name: Run integration tests (Linux only)
        if: runner.os == 'Linux'
        run: cargo test --features all,wami --test '*' -- --test-threads=1

  # Note: Minimal Versions (feature-powerset) check moved to release.yml
  # as it's too slow for PR/push CI (~10+ min) and only needed before release.
