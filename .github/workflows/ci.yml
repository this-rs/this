name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/*.mmd'
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Un push qui en remplace un autre annule le run précédent. Sans ça, chaque
# correction poussée coup sur coup empile un run complet ; le dernier — le seul
# qui compte — attend que les périmés finissent. Mesuré sur this-examples le
# 05/11/2026 : quatre pushes, quatre runs de ~25 min en file.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Documentation-only changes ─────────────────────────────────────────────
  # Every other job needs `code == 'true'`. `paths-ignore` used to live on
  # `pull_request` too: a docs-only PR then had NO check at all, and a required
  # status check that never reports blocks the merge forever. Computing it here
  # instead keeps a docs-only PR at a few seconds and gives the required
  # `CI gate` check something to report on every single PR.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      harness: ${{ steps.filter.outputs.harness }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did anything other than documentation change?
        id: filter
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no base commit to diff against: assume code changed"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "harness=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "$GITHUB_SHA" || true)
          echo "changed files:"; printf '%s\n' "$changed"
          code=$(printf '%s\n' "$changed" | grep -vE '(\.md$|\.mmd$|^docs/)' | grep -c . || true)
          echo "code files: $code"
          if [ "$code" -gt 0 ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          # Le harnais et ce qu'il tire (this-agent, this-llm) : un changement là peut casser wasm32.
          if printf '%s\n' "$changed" | grep -qE '^(crates/(this-harness|this-agent|this-llm|this-llm-providers)/|scripts/lint-harness-portability\.rs|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml)'; then echo "harness=true" >> "$GITHUB_OUTPUT"; else echo "harness=false" >> "$GITHUB_OUTPUT"; fi

  # Test sur plusieurs versions de Rust
  test:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Test Suite
    runs-on: ubuntu-latest
    # Nightly is expected to be GREEN (see the feature set below). `continue-on-error`
    # stays: if a dependency we add later stops building on nightly, this leg must report
    # it without blocking a merge — stable and beta are the ones that decide a merge.
    # A red nightly leg therefore means "look at this", not "you cannot ship".
    continue-on-error: ${{ matrix.rust == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: stable
            features: all,wami
          - rust: beta
            features: all,wami
          # Nightly answers ONE question: does OUR code compile and pass on tomorrow's
          # compiler? It cannot answer the full-matrix question, because several third
          # party async crates do not build on it today:
          #   error[E0391]: cycle detected when computing when
          #     `dynamic::field::FieldValueInner` needs async drop   (async-graphql 7.2.1)
          #   error[E0391]: … when `error::Error` needs async drop     (mongodb)
          # Those are upstream and unrelated to this crate. Running them nightly kept a
          # check red on every single run — which is how a team learns to ignore red.
          # This set covers everything written here (storage core, websocket, push,
          # signed modules, OIDC, WAMI) and nothing that does not compile. If a real
          # nightly regression appears in our code, this leg goes red and says so.
          - rust: nightly
            features: in-memory,websocket,push,module-signing,oidc,wami
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create local dep stubs
        run: bash .github/create-local-dep-stubs.sh

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

      # Use --features all,wami (not --all-features) because obrain and
      # frontend depend on local path checkouts not available on CI.
      - name: Run unit tests
        run: cargo test --lib --features ${{ matrix.features }} --verbose

      - name: Run integration tests (sequential for DB isolation)
        run: cargo test --features ${{ matrix.features }} --test '*' -- --test-threads=1

      - name: Run doc tests
        run: cargo test --doc --features ${{ matrix.features }}

      # The scope fallback in `SurfaceGuard::with_env` and `Authorization::check_iam` only runs
      # when NO IAM plan is wired — which is exactly the shape of an OIDC resource server. The
      # `all,wami` build above never compiles that path, so a `cfg` mistake there stays green in
      # CI and breaks a real deployment (found on #92: `PermissionFn` was cfg-gated to
      # obrain/wami while the no-IAM branch used it unconditionally).
      # Stable only: the invariant is about feature gating, not about the compiler, and the
      # `graphql` half of this combination does not build on nightly (async-graphql, E0391).
      # Running it on every leg added a red check for a property already proven here once.
      - name: Check the surfaces with no IAM plan (the OIDC shape)
        if: matrix.rust == 'stable'
        run: cargo check --no-default-features --features graphql,grpc,websocket

      - name: Test this-descriptor (pure crate, every feature)
        run: cargo test -p this-descriptor --all-features

      # The module language: lexer, parser, type checker, interpreter and the WAT
      # emitter. `--test '*'` matters as much as `--lib`: `tests/parity.rs` runs every
      # program through a real wasm engine (`wasmi`) and compares the result with the
      # interpreter. Without that step the emitter is checked by nothing.
      - name: Test this-module-lang (pure crate)
        run: |
          # Default features: the language alone, zero dependencies.
          cargo test -p this-module-lang --lib
          cargo test -p this-module-lang --test '*'
          # `descriptor` adds the rule bridge into this-descriptor (two end-to-end
          # tests go through the real validation engine).
          cargo test -p this-module-lang --all-features

      # Le harness ne tourne pas sous `all,wami` non plus : son exécuteur `wasmi`
      # est une feature à lui. Sans cette étape, les tests qui comparent
      # l'interpréteur et le moteur wasm ne tournent nulle part en CI — et une
      # couverture sur du code jamais compilé ne prouverait rien.
      - name: Test this-module-harness (engine behind a feature)
        run: |
          # Sans la feature : le crate pur (compiler, ranger, relire).
          cargo test -p this-module-harness
          # Avec : l'exécuteur wasmi, comparé à l'interpréteur sur valeur ET effets.
          cargo test -p this-module-harness --features wasmi

      # A language rule is `CustomScope::Both` by default: it runs on the server AND in
      # the front, written once instead of reimplemented in TypeScript. That promise is
      # only true if the crate builds for wasm32 with the bridge enabled.
      - name: Check this-module-lang on wasm32 (rules run in the front too)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p this-module-lang --features descriptor --target wasm32-unknown-unknown

      - name: Check this-descriptor on wasm32 (no server dependency)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p this-descriptor --target wasm32-unknown-unknown
          cargo check -p this-descriptor --target wasm32-unknown-unknown --features yaml,pattern
          # The Leptos bridge (`impl FromServerFnError`) targets wasm32 on the client side.
          # `--all-features` above only proves it for the host toolchain.
          cargo check -p this-descriptor --target wasm32-unknown-unknown --features leptos

  # Code coverage
  coverage:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create local dep stubs
        run: bash .github/create-local-dep-stubs.sh

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # ÉPINGLÉ à 1.99.1, et ce n'est pas une préférence : avec rustc 1.100.0 (stable du
      # 09/11/2026), `cargo-llvm-cov` — 0.9.1, la dernière — rend **0,00 % pour tous les
      # fichiers**. Les tests tournent et passent, leurs profils ne sont pas collectés.
      #   Mesuré le 13/11/2026 sur `this-platform` seul, mêmes tests :
      #     1.97.1 → 96,35 %   1.98.1 → 96,35 %   1.99.1 → 96,35 %   1.100.0 → 0,00 %
      # Conséquence en CI : `codecov/patch` refusait toute PR touchant un fichier mesuré,
      # avec des chiffres qui ne mesuraient plus rien (le peu de couverture restant venait
      # des binaires d'AUTRES crates qui lient le fichier). Désépingler dès que
      # cargo-llvm-cov sait lire les profils de 1.100 — c'est la seule chose à faire.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          # Un test de cette suite compile un module en wasm32 pour vérifier ses exports
          # (`render` présent seulement si le module nomme une fonction de rendu). Sans
          # la cible, rustc répond « can't find crate for std » et le job tombe.
          targets: wasm32-unknown-unknown

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-

      # The container-backed tests pull their images at run time; a transient registry error
      # (measured: "bytes remaining on stream" on mongo:5.0.6) failed the whole job. Pull them
      # here with retries so the test run never depends on a single registry response.
      - name: Pre-pull test container images (retry on transient registry errors)
        run: |
          for img in cassandra:4.1 mongo:5.0.6 neo4j:5 postgres:11-alpine mysql:8.1; do
            for attempt in 1 2 3 4 5; do
              if docker pull --quiet "$img" >/dev/null; then break; fi
              echo "::warning::pull of $img failed (attempt $attempt), retrying"
              sleep $((attempt * 15))
              if [ "$attempt" = 5 ]; then echo "::error::cannot pull $img"; exit 1; fi
            done
          done

      - name: Generate code coverage
        # `this-module-harness/wasmi` : sans cette feature, l'exécuteur n'est pas
        # compilé, ses lignes n'ont aucune donnée de couverture, et `codecov/patch`
        # les compte comme non couvertes. On ne peut pas couvrir ce qu'on ne compile pas.
        run: cargo llvm-cov --features all,wami,this-module-harness/wasmi --workspace --lcov --output-path lcov.info -- --test-threads=1

      # Le rapport lui-même, pour pouvoir répondre à « pourquoi cette ligne est-elle dite non
      # couverte ? » sans relancer la CI. Mesuré le 13/11/2026 : `codecov/patch` accusait 77
      # lignes dans un fichier que la mesure locale donnait entièrement couvert, et rien dans
      # le dépôt ne permettait de comparer les deux jeux de données.
      - name: Upload lcov (diagnostic)
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Vérification du formatage
  fmt:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        # rustfmt on the tracked files: `cargo fmt` runs `cargo metadata`, which loads
        # the optional obrain/vite-rs path dependencies (absent on the runner) once the
        # workspace declares members. Formatting is the same check.
        run: git ls-files '*.rs' | xargs rustfmt --edition 2024 --check

  # Clippy linting
  clippy:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create local dep stubs
        run: bash .github/create-local-dep-stubs.sh

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: |
          cargo clippy --all-targets --features all,wami -- -D warnings
          # Workspace members are not covered by the command above: it lints the root
          # package only. A new member with warnings would stay green otherwise.
          cargo clippy -p this-module-lang --all-targets --all-features -- -D warnings
          cargo clippy -p this-module-harness --all-targets --all-features -- -D warnings
          cargo clippy -p this-agent --all-targets --all-features -- -D warnings
          cargo clippy -p this-harness --all-targets --all-features -- -D warnings

  # Vérification de la compilation des exemples
  examples:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Build Examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create local dep stubs
        run: bash .github/create-local-dep-stubs.sh

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-examples-${{ hashFiles('**/Cargo.lock') }}

      - name: Build simple_api example
        run: cargo build --example simple_api

      - name: Build microservice example
        run: cargo build --example microservice

      - name: Build full_api example
        run: cargo build --example full_api

  # Vérification de sécurité avec cargo-audit
  security_audit:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create local dep stubs
        run: bash .github/create-local-dep-stubs.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        # Ignore known unfixable transitive advisories (all pending upstream fixes):
        # RUSTSEC-2023-0071: RSA Marvin Attack (rsa via sqlx-mysql)
        # RUSTSEC-2024-0384, 0436, 0449: transitive deps
        # RUSTSEC-2025-0012: backoff, 0111: tokio-tar, 0134, 0141: bincode
        # RUSTSEC-2026-0098, 0099, 0104, 0258, 0346, 0349, 0382: h2/rustls/rustls-webpki
        # RUSTSEC-2026-0387: crypto-bigint 0.5 (timing) via jsonwebtoken 10 → p256/p384,
        #   i.e. ECDSA paths; this-rs and wami sign/verify EdDSA only (ed25519-dalek).
        #   Fix is crypto-bigint >=0.7.6, not yet reachable from the p256 0.13 line.
        # RUSTSEC-2026-0459: libsqlite3-sys 0.37 (SQLite CVE-2026-119375) via sqlx-sqlite,
        #   the OPTIONAL sqlite driver. Measured 09/11/2026: no feature of this workspace
        #   enables it, and `cargo tree --all-features` contains zero sqlite crate, so the
        #   vulnerable C is never compiled nor linked — it is in Cargo.lock only because a
        #   lock file lists optional dependencies whatever the features. The fix needs
        #   libsqlite3-sys >= 0.39, and sqlx-sqlite 0.9.0 (the latest published) pins ^0.37.
        run: >-
          cargo audit
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2024-0384
          --ignore RUSTSEC-2024-0436
          --ignore RUSTSEC-2024-0449
          --ignore RUSTSEC-2025-0012
          --ignore RUSTSEC-2025-0111
          --ignore RUSTSEC-2025-0134
          --ignore RUSTSEC-2025-0141
          --ignore RUSTSEC-2026-0098
          --ignore RUSTSEC-2026-0099
          --ignore RUSTSEC-2026-0104
          --ignore RUSTSEC-2026-0258
          --ignore RUSTSEC-2026-0346
          --ignore RUSTSEC-2026-0349
          --ignore RUSTSEC-2026-0382
          --ignore RUSTSEC-2026-0387
          --ignore RUSTSEC-2026-0459

  # Vérification de la documentation
  docs:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create local dep stubs
        run: bash .github/create-local-dep-stubs.sh

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-docs-${{ hashFiles('**/Cargo.lock') }}

      - name: Check documentation
        run: cargo doc --no-deps --features all,wami
        env:
          RUSTDOCFLAGS: -D warnings

  # Vérification de la compilation sur différentes plateformes
  cross-platform:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Cross Platform Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create local dep stubs
        run: bash .github/create-local-dep-stubs.sh
        shell: bash

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --features all,wami

      # Unit tests run on all platforms (no Docker needed).
      # Integration tests (testcontainers) only run on Linux where Docker is available.
      - name: Run unit tests
        run: cargo test --lib --features all,wami

      - name: Run integration tests (Linux only)
        if: runner.os == 'Linux'
        run: cargo test --features all,wami --test '*' -- --test-threads=1

  # Note: Minimal Versions (feature-powerset) check moved to release.yml
  # as it's too slow for PR/push CI (~10+ min) and only needed before release.

  # ── The one check a branch protection rule should require ──────────────────
  # `if: always()` makes it report even when a dependency failed, which is the
  # whole point: a red CI must be able to block a merge. A skipped job counts as
  # fine here, and that is honest — a docs-only PR genuinely had nothing to check.
  # Les sources Swift du pont iOS ne sont compilées par AUCUN job : le crate
  # `tauri-plugin-this-device` est hors workspace, et `cargo build --target
  # aarch64-apple-ios` ne compile que le Rust (mesuré le 08/11/2026 : un `touch` sur
  # un `.swift` ne déclenche aucune recompilation). Cinq erreurs Swift ont donc vécu
  # dans `main` jusqu'à ce qu'une session construise l'app pour de vrai (PR #185).
  #
  # On ne peut pas lancer `cargo tauri ios build` en CI (il faut Xcode et le projet
  # de l'app), mais les fichiers qui n'importent PAS Tauri — les moteurs :
  # CoreBluetooth, AVFoundation, et les types de réponse — se type-checkent avec le
  # SDK iOS. C'est la partie qu'on pouvait casser sans qu'aucun voyant ne s'allume.
  swift_ios:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Swift (moteurs iOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Type-check the iOS sources that do not import Tauri
        run: |
          set -euo pipefail
          if ! xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1; then
            echo "pas de SDK iOS sur ce runner : rien à vérifier (le job ne prétend pas passer)"
            exit 0
          fi
          cd crates/this-device-tauri/ios/Sources
          # `grep -L` : les fichiers SANS `import Tauri`. Les sélecteurs `@objc` (qui
          # importent Tauri) ne peuvent être vérifiés que par un build d'app complet.
          # `Commun/` porte ce que plusieurs fichiers partagent (`Etat`) : `*.swift` ne
          # descend pas dans les sous-dossiers, il faut le nommer, sinon un fichier
          # qui s'en sert est vérifié sans sa définition (#273).
          files="$(grep -L "import Tauri" *.swift | tr '\n' ' ') $(ls Commun/*.swift | tr '\n' ' ')"
          echo "fichiers vérifiés : $files"
          # shellcheck disable=SC2086
          xcrun --sdk iphoneos swiftc -typecheck -target arm64-apple-ios17.0 $files

      # Le crate du pont est HORS workspace (Tauri tire GTK sous Linux), donc
      # `cargo test --workspace` ne le voyait pas : ses garde-fous — la parité des
      # arguments, les ancres de l'éditeur de liens, le `state` des méthodes d'état,
      # la parité carte ↔ pont ↔ Swift — ne tournaient NULLE PART. Mesuré le
      # 13/11/2026 : trois défauts vivaient dans `main` avec une CI verte.
      #
      # macOS, pas Linux : le backend `src/linux/` du pont ne se compile qu'avec les
      # services d'un bureau Linux, et ce crate est fait pour Apple.
      - name: Contrat, familles et parités (sans appareil)
        run: |
          set -euo pipefail
          cd crates/this-device-tauri
          cargo test --features banc

  # Le backend Linux du pont d'appareil ne se compile QUE sous Linux : sur le job macOS
  # (`swift_ios`), `src/linux/` est `cfg`-éteint, et `cargo test --workspace` ne voit pas le
  # crate (il est hors workspace). Ses 3 000 lignes et ses 54 tests ne tournaient donc nulle
  # part — mesuré le 13/11/2026 : la branche qui a livré ce backend est passée en CI sans
  # qu'un seul de ses tests ne s'exécute, et `codecov/patch` le comptait comme non couvert.
  device_linux:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Pont d'appareil (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Ce que `tauri` réclame sur Linux, mesuré le 13/11/2026 en trois passes : GLib
      # (`gobject-2.0`, `gio-2.0`), puis GTK 3 (`gdk-3.0`, `atk`), puis WebKitGTK
      # (`libsoup-3.0`). Les features par défaut n'y changent rien : `default-features = false`
      # évite la pile webview de *Tauri*, pas les bibliothèques système qu'elle lie. Le
      # commentaire du Cargo.toml affirmait que Linux n'avait besoin de rien — c'était faux,
      # et ce job est ce qui l'a dit.
      - name: En-têtes GTK 3 + WebKitGTK (ce que `tauri` réclame sur Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Contrat, familles, backend Linux et parités
        run: |
          set -euo pipefail
          cd crates/this-device-tauri
          cargo test --features banc

  # Les crates wasm-only portent leur propre `[workspace]`, donc ils sont absents
  # de `cargo check --workspace` : aucun job ne les compilait. Cinq crates — dont
  # l'interface Leptos et le client des protocoles — pouvaient cesser de compiler
  # pendant des semaines sans qu'un voyant ne s'allume.
  wasm_crates:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Wasm-only crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Ce job ne chargeait jusqu’ici que des crates à `[workspace]` propre, donc jamais
      # le manifeste racine. Le manifeste racine, lui, tire `../../obrain/…` et
      # `../../vite-rs`, absents du runner : mêmes doublures que tous les autres jobs.
      - name: Create local dep stubs
        run: bash .github/create-local-dep-stubs.sh

      # `this-agent` and `this-harness` are members of the ROOT workspace, so they are
      # checked with `-p` from the root; the crates below carry their own `[workspace]`
      # and can only be built from their own directory. `this-harness` has a
      # `cfg(target_arch = "wasm32")` `now_ms()` (`js_sys::Date::now()`) that no other
      # job ever compiles.
      - name: Compile the root-workspace members for wasm32
        run: |
          set -euo pipefail
          echo "::group::this-agent this-harness"
          cargo check -p this-agent -p this-harness --target wasm32-unknown-unknown
          echo "::endgroup::"

      - name: Compile the crates that keep their own workspace
        run: |
          set -euo pipefail
          for crate in this-ui this-client-web this-vfs-web this-module-harness-web; do
            echo "::group::$crate"
            ( cd "crates/$crate" && cargo check --target wasm32-unknown-unknown )
            echo "::endgroup::"
          done
          # `this-shell-tauri` est exclu volontairement : Tauri exige GTK et WebKit,
          # que ce runner n'a pas. C'est une exclusion assumée, pas un oubli — et
          # elle est écrite ici pour que personne ne la prenne pour une couverture.

  # Le harnais doit tourner dans une page, une app mobile et sur un serveur : il se
  # compile donc en wasm32, SANS feature par défaut. Rien ne protégeait cette propriété —
  # une dépendance de plateforme pouvait entrer et casser wasm32 sans qu'on le voie avant
  # la livraison. Deux gardes : (1) la compilation, (2) un lint de liste noire qui nomme
  # fichier:ligne:symbole. Le lint vit ICI et non dans `clippy` : il n'a besoin que de
  # `rustc`, et c'est dans ce job qu'on lit l'échec wasm32 — un seul endroit à regarder.
  # Filtré sur les chemins par `changes.harness` (et non `paths:` du workflow : un
  # `paths:` ferait disparaître le check, et un check requis absent bloque la fusion).
  wasm32_harness:
    needs: changes
    if: needs.changes.outputs.harness == 'true'
    name: Harness wasm32
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Create local dep stubs
        run: bash .github/create-local-dep-stubs.sh

      - name: Blacklist lint (no platform API in the harness)
        run: |
          rustc --edition 2024 -O scripts/lint-harness-portability.rs -o "$RUNNER_TEMP/lint-harness"
          "$RUNNER_TEMP/lint-harness" crates/this-harness/src

      - name: Compile this-harness for wasm32
        run: cargo check -p this-harness --target wasm32-unknown-unknown --no-default-features

      # Le client des providers tourne AUSSI dans la page (chemin navigateur de l'Atelier) :
      # un `tokio::time` hors garde `cfg(not(wasm32))` y casse la compilation sans que ce
      # workspace ne le voie (mesuré le 11/11/2026 sur #255 : vert ici, rouge dans l'app).
      - name: Compile this-llm-providers for wasm32
        run: cargo check -p this-llm-providers --target wasm32-unknown-unknown

  # Le backend obrain est le seul dont les dépendances ne sont pas sur crates.io :
  # `Cargo.toml` les déclare par PATH (`../../obrain/obrain-db/crates/...`). Deux
  # conséquences qu'aucun job ne couvrait :
  #   - `release.yml` EXCLUT `obrain` du feature-powerset
  #     (`--exclude-features all,frontend,obrain,obrain-cognitive`) et la suite de
  #     tests tourne avec `--features all,wami` : la feature n'était compilée NULLE PART ;
  #   - elle a pourri en silence jusqu'à ne plus compiler du tout (06/11/2026 :
  #     `src/storage/vfs/obrain.rs` importait `check_shape`/`list_flat`, devenus
  #     `pub(crate)` dans le crate `this-vfs`, plus un `conformance` qui avait déménagé).
  # Et son chemin pointait `../../banc-obrain-j4`, un snapshot figé de la consolidation
  # d'octobre : le framework compilait contre un moteur qui ne bougeait plus, ce qui a
  # masqué une rupture (obrain-db `dcba1fab` refuse désormais deux ouvertures en écriture
  # dans le même processus).
  # Ce job clone le moteur là où le path-dependency l'attend et fait tourner SES tests —
  # les seuls qui ouvrent une vraie base et prouvent la durabilité au reopen.
  obrain:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Obrain Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # `obrain-db/obrain` est PRIVÉ (mesuré le 06/11/2026 : `gh api` → private=true).
      # Un clone anonyme échoue donc (« could not read Username »). Deux issues, et
      # une seule honnête : avec un jeton, on couvre vraiment ; sans jeton, on le DIT
      # au lieu de laisser croire que la feature est testée. Le job reste vert dans
      # les deux cas, mais l'avertissement est visible dans l'onglet Actions.
      - name: Checkout obrain-db (private, needs OBRAIN_TOKEN)
        id: engine
        env:
          OBRAIN_TOKEN: ${{ secrets.OBRAIN_TOKEN }}
        run: |
          set -euo pipefail
          DEP="$(cd "$GITHUB_WORKSPACE/../.." && pwd)/obrain/obrain-db"
          if [ -z "${OBRAIN_TOKEN:-}" ]; then
            echo "engine=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Obrain Backend non couvert::obrain-db/obrain est privé et le secret OBRAIN_TOKEN n'est pas défini. La feature \`obrain\` n'est donc PAS compilée ni testée ici — ajouter un PAT en lecture sur obrain-db/obrain sous le nom OBRAIN_TOKEN active ce job."
            exit 0
          fi
          rm -rf "$DEP"
          mkdir -p "$(dirname "$DEP")"
          git clone --depth 1 "https://x-access-token:${OBRAIN_TOKEN}@github.com/obrain-db/obrain.git" "$DEP"
          echo "obrain engine at $DEP ($(git -C "$DEP" rev-parse --short HEAD))"
          echo "engine=true" >> "$GITHUB_OUTPUT"

      - name: Install protoc
        if: steps.engine.outputs.engine == 'true'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        if: steps.engine.outputs.engine == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Test the obrain backend against a real store
        if: steps.engine.outputs.engine == 'true'
        run: |
          # `::` en fin de scalaire simple fait de la ligne une clé pour YAML : bloc.
          cargo test --features obrain --lib storage::

  gate:
    name: CI gate
    if: always()
    needs: [changes, test, coverage, fmt, clippy, examples, security_audit, docs, cross-platform, wasm_crates, wasm32_harness, obrain, swift_ios, device_linux]
    runs-on: ubuntu-latest
    steps:
      - name: Nothing failed, nothing was cancelled
        run: |
          results="${{ join(needs.*.result, ',') }}"
          echo "job results: $results"
          case ",$results," in
            *,failure,*|*,cancelled,*)
              echo "::error::at least one CI job failed or was cancelled"
              exit 1
              ;;
          esac
          echo "all jobs passed, or were skipped by design (documentation-only change)"

