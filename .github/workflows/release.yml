name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # ── Feature compatibility check (gates the release) ────────────────
  minimal-versions:
    name: Minimal Versions Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create local dep stubs
        run: bash .github/create-local-dep-stubs.sh

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-hack
        run: cargo install cargo-hack

      - name: Check feature powerset
        # --depth 2 limits to pairs of features (instead of full 2^N powerset)
        # --exclude-features all,frontend,obrain,obrain-cognitive skips the meta-feature that enables everything
        run: cargo hack check --feature-powerset --depth 2 --exclude-features all,frontend,obrain,obrain-cognitive --no-dev-deps

  # ── Create GitHub Release ──────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: minimal-versions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

  # ── Publish to crates.io ───────────────────────────────────────────
  #
  # DISABLED for v0.0.10, on purpose and reversibly.
  #
  # The manifest declares the six `obrain-*` crates as optional *path*
  # dependencies (`../../banc-obrain-j4/crates/...`). cargo refuses to package a
  # crate whose optional dependency is absent from the registry — proven on a
  # scratch crate: both `cargo package` and `cargo publish --dry-run` answer
  # "no matching package named ... found". Giving the dependency a `version`
  # does not help, and neither does a git spec carrying a `version`. The only
  # fixes are (a) publish obrain to crates.io, which is reserved for obrain's
  # real v0.0.1 (crates.io is immutable: no draft for a database), or (b) move
  # the obrain integration out of this crate's manifest.
  #
  # Until one of those lands, this job would fail *after* the GitHub Release was
  # already created, leaving a red run for a release that is otherwise fine. It
  # is therefore skipped unless the repository variable PUBLISH_CRATES_IO is set
  # to 'true'. Turn that variable on the day `cargo package -p this-rs`
  # succeeds locally.
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: create-release
    if: ${{ vars.PUBLISH_CRATES_IO == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create local dep stubs
        run: bash .github/create-local-dep-stubs.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}

      # this-rs depends on `this-descriptor = { version, path }`: crates.io must know the
      # descriptor version BEFORE this-rs is packaged. Idempotent: skipped when published.
      - name: Publish this-descriptor first
        run: |
          V=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="this-descriptor") | .version')
          if curl -sf "https://crates.io/api/v1/crates/this-descriptor/$V" -A "this-rs-release" > /dev/null; then
            echo "this-descriptor $V already on crates.io"
          else
            cargo publish -p this-descriptor --token ${{ secrets.CARGO_TOKEN }}
            sleep 30
          fi

      - name: Verify package
        run: cargo package -p this-rs --allow-dirty

      - name: Publish to crates.io
        run: cargo publish -p this-rs --allow-dirty --token ${{ secrets.CARGO_TOKEN }}
