# this-rs (BAP fork) — CI Pipeline
#
# Validates the `extra_derives:` macro forwarding patch on top of upstream
# this-rs v0.0.9 (commit 71e5544).
#
# Scope (intentionally minimal): unit tests + proof tests for the patch.
# Integration tests (MySQL, Postgres, Neo4j, MongoDB, ScyllaDB, gRPC, ...)
# are skipped — they require live infra and are out of scope for a fork
# that only patches the entity macros. Upstream covers them.
#
# Runs on homelab runner (BAP group #52597844, Docker executor).

stages:
  - lint
  - test

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  RUSTFLAGS: "-D warnings"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cargo/registry/
    - .cargo/git/
    - target/

# ── Common setup (protoc required by gRPC build script) ──
.before_script: &before_script
  - apt-get update -qq
  - apt-get install -y -qq protobuf-compiler
  - rustc --version && cargo --version

# ── Lint ──
fmt-check:
  stage: lint
  image: rust:1.94-bookworm
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check
  allow_failure: true  # upstream may not be fmt-clean; we don't gate on it

# ── Tests ──
unit-tests:
  stage: test
  image: rust:1.94-bookworm
  before_script:
    - *before_script
  script:
    # Baseline: all 1104 upstream unit tests must remain green
    - cargo test --lib --all-features
  artifacts:
    when: always
    reports:
      junit: target/junit.xml
    expire_in: 1 week

extra-derives-proof:
  stage: test
  image: rust:1.94-bookworm
  before_script:
    - *before_script
  script:
    # Proof tests for the `extra_derives:` slot (4 tests):
    #   - 2 backward-compat (legacy syntax still works)
    #   - 2 forward functional (Hash/PartialEq/Eq derives flow through)
    - cargo test --test macro_extra_derives
