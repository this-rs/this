[package]
name = "this-module-lang"
version = "0.0.1"
edition = "2024"
authors = ["Riviere Théotime <t@ffs.holdings>"]
license = "MIT OR Apache-2.0"
description = "Le langage de module de this-rs : un AST, un typeur, un interpréteur et une émission WAT. Total par construction — pas de boucle, pas d'I/O non déclarée."
repository = "https://github.com/this-rs/this"
keywords = ["framework", "module", "wasm", "language"]
categories = ["development-tools"]
# Pas encore publiée : elle n'est la dépendance publiée de personne, et un
# `cargo publish --workspace` ne doit pas l'emporter par accident.
publish = false

[features]
default = []
# Un programme comme règle de descripteur (`register_rule`). Hors de cette feature
# la crate reste sans aucune dépendance, donc trivialement wasm32.
descriptor = ["dep:this-descriptor", "dep:serde_json"]
# Assembler le WAT émis en binaire wasm, dans le processus. C'est ce qui permet
# d'exécuter un module DANS la page : le navigateur reçoit des octets et appelle
# `WebAssembly.instantiate`, sans `wabt.js` à charger. Pur Rust, compile wasm32.
assemble = ["dep:wat"]

[dependencies]
# Un module stocké qui porte des règles est validé par `this-descriptor` ; la
# dépendance est optionnelle pour que le langage seul n'entraîne rien.
this-descriptor = { version = "0.0.1", path = "../this-descriptor", optional = true, default-features = false }
serde_json = { version = "1.0", optional = true }
# Même version que la dev-dependency : l'assembleur des tests est celui du produit.
wat = { version = "1.263.0", optional = true }

[[example]]
name = "rules"
# La démo a besoin du pont vers this-descriptor ; le langage seul reste sans
# aucune dépendance.
required-features = ["descriptor"]

[dev-dependencies]
wasmi = "2.0.0"
wat = "1.263.0"
