[package]
name = "plan-store"
version = "0.1.0"
edition = "2024"
publish = false
description = "Adaptateur de stockage générique pour les modules `this` : read path (Request::rows) + write path (Effects), sans connaissance d'aucune entité."

[dependencies]
this-module-sdk = { path = "../this-module-sdk" }
serde_json = "1.0"

[dev-dependencies]
this-module-plan = { path = "../this-module-plan" }
this-descriptor = { path = "../this-descriptor" }
serde_json = "1.0"
