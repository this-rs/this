[package]
name = "tauri-plugin-this-device"
version = "0.0.1"
edition = "2024"
authors = ["Riviere Théotime <t@ffs.holdings>"]
license = "MIT OR Apache-2.0"
description = "Tauri 2 iOS plugin, raw device bridge: gyroscope sample, Bluetooth scan and permission status, as the this-platform device contract. Not for direct exposure to a webview."
repository = "https://github.com/this-rs/this"
keywords = ["tauri", "plugin", "ios", "gyroscope", "bluetooth"]
categories = ["gui"]
# Tauri plugin convention: package `tauri-plugin-<name>` and `links` equal to it.
links = "tauri-plugin-this-device"

# Hors du workspace racine, comme `this-shell-tauri` : Tauri tire GTK/WebKit sur Linux, et la
# CI Ubuntu compile le workspace racine. Ce crate se construit et se teste seul.
[workspace]

[lib]
name = "this_device_tauri"
path = "src/lib.rs"

[features]
# Le banc d'essai du pont (`src/banc.rs`) : balaie tout le contrat sur l'appareil devant soi
# et rend un rapport. Hors production par construction — un hôte qui veut mesurer l'active.
default = []
banc = []

[dependencies]
this-platform = { path = "../this-platform" }
# No default features: on desktop and Linux, Tauri's default webview stack (WebKitGTK) is not
# pulled in. The iOS webview backend is enabled below.
#
# Ce que cela ne dit PAS : GLib reste requis. Mesuré le 13/11/2026 en compilant ce crate sur
# Ubuntu : `tauri` tire `glib-sys`/`gobject-sys`/`gio-sys` même sans features, et le build
# s'arrête sur `gobject-2.0` introuvable. `libglib2.0-dev` suffit (le job `device_linux` de la
# CI l'installe) ; WebKitGTK, lui, n'est pas nécessaire.
tauri = { version = "2.12", default-features = false }
# `timeout` autour de l'appel natif : un plugin muet ne doit pas bloquer un tour.
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }

[dev-dependencies]
# `tests/surface_parity.rs` : la carte du harness (`this_agent::surface`) doit nommer chaque
# capacité et chaque méthode du pont. Crate pur, sans Tauri : il ne tire rien de lourd.
this-agent = { path = "../this-agent" }

[target.'cfg(target_os = "ios")'.dependencies.tauri]
version = "2.12"
features = ["wry"]
default-features = false

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Linux : le pont parle aux services du bureau par D-Bus (BlueZ pour le Bluetooth, GeoClue2 pour la
# position, le portail XDG pour caméra et micro en sandbox). zbus est du Rust pur : pas de
# libdbus, donc pas de pkg-config. La feature `tokio` aligne son exécuteur sur celui de Tauri.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
# L'exécuteur des tests purs et des attentes bornées (`rt` : `Builder`, `time` : `sleep`).
tokio = { version = "1", features = ["rt", "time"] }
