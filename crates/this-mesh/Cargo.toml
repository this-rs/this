[package]
name = "this-mesh"
version = "0.0.1"
edition = "2024"
authors = ["Riviere Théotime <t@ffs.holdings>"]
license = "MIT OR Apache-2.0"
description = "Mesh protocol layer, transport-independent: message envelope, deterministic signed bytes, peer registry and admission gate. No network I/O."
repository = "https://github.com/this-rs/this"
publish = false

[dependencies]
# Le vocabulaire des clés (Active/Revoked, Ownership/Shared, AnchorKey) existe déjà
# dans le contrat VFS, pur et wasm32-safe : on le réutilise, on n'en crée pas un second.
this-vfs = { version = "0.0.1", path = "../this-vfs" }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
uuid = { version = "1.10", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
# Le SAS est un HMAC-SHA256 : primitives pures, sans I/O, déjà dans l'arbre
# (ed25519-dalek tire sha2 pour SHA-512, hkdf tire hmac) — aucun code natif ajouté.
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }

# --- Transport QUIC (feature `transport`, éteinte par défaut) ---
# La crate reste pure et sans I/O sans cette feature (utilisable en wasm).
# Le repli mesuré (iroh ne compile pas pour iOS) : quinn 0.11 + rustls 0.23
# (provider `ring`, sans aws-lc-rs qui exige cmake/nasm) + tokio, certificat
# Ed25519 auto-signé épinglé par la clé d'appareil. rcgen dérive le certificat
# de la même clé Ed25519 que les signatures de messages.
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio", "log"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "io-util", "macros"], optional = true }
rcgen = { version = "0.13", default-features = false, features = ["ring"], optional = true }

[features]
default = []
transport = ["dep:quinn", "dep:rustls", "dep:tokio", "dep:rcgen"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
