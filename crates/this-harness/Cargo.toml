[package]
name = "this-harness"
version = "0.0.1"
edition = "2024"
authors = ["Riviere Théotime <t@ffs.holdings>"]
license = "MIT OR Apache-2.0"
description = "The agent launch loop: turns, a queue of held messages, typed events, cancellation — transport, tools and storage stay in the app"
repository = "https://github.com/this-rs/this"
keywords = ["agent", "harness", "llm", "streaming"]
categories = ["development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The decisions of the loop are a separate, pure crate: this one adds the
# effects (the model call, the tools, the events) around them.
this-agent = { version = "0.0.1", path = "../this-agent" }
async-trait = "0.1"
# Le type d'une image jointe : défini une fois, là où le provider le lit aussi.
this-llm = { version = "0.0.1", path = "../this-llm" }
# L'empreinte de la sortie complète d'un outil (`Step::out_hash`). Même
# algorithme que le magasin (le crate racine l'a déjà) ; Rust pur, donc wasm32
# sans feature `asm` — l'atelier le compile déjà en wasm (sha2 0.10.9).
sha2 = "0.10"

# The clock the target actually has. A page has `Date.now`, a shell has the
# system clock; asking either one for the other's API is a compile error, so
# the dependency is per-target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
# Only for `block_on` in tests: the crate itself brings no runtime.
futures = "0.3"
# Only to prove that the failure families of a provider are codes this harness knows.
this-llm-providers = { path = "../this-llm-providers", default-features = false }
