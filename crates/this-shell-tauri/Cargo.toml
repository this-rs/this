[package]
name = "tauri-plugin-this-shell"
version = "0.0.1"
edition = "2024"
authors = ["Riviere Théotime <t@ffs.holdings>"]
license = "MIT OR Apache-2.0"
description = "Tauri 2 plugin that connects a this-rs app's window, Dock and lifecycle to the this-platform decisions"
repository = "https://github.com/this-rs/this"
keywords = ["tauri", "plugin", "desktop", "mobile", "lifecycle"]
categories = ["gui"]
# Tauri plugin convention: package `tauri-plugin-<name>` and `links` equal to it, so the
# permissions appear as `<name>:default`. The library keeps the name `this_shell_tauri`.
links = "tauri-plugin-this-shell"

# Tauri needs GTK/WebKit on Linux: this crate must NOT join the root workspace of `this`,
# or the Ubuntu jobs of its CI fail to build. It declares its own workspace, like the
# desktop shell of this-examples.
[workspace]

[lib]
name = "this_shell_tauri"
path = "src/lib.rs"

[dependencies]
this-platform = { path = "../this-platform" }
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }

[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"
objc2 = "0.6"
