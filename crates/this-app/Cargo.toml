[package]
name = "this-app"
version = "0.0.1"
edition = "2024"
authors = ["Riviere Théotime <t@ffs.holdings>"]
license = "MIT OR Apache-2.0"
description = "Les contrats purs d'une app this-rs : démarrage, réglages, avis, capacités d'appareil. Aucun DOM, aucun Tauri, aucun HTTP — testable sur l'hôte."
repository = "https://github.com/this-rs/this"
keywords = ["framework", "application", "contracts"]
categories = ["development-tools"]

[dependencies]
# L'habillage et le cycle de vie viennent du framework, pas d'une copie.
this-platform = { path = "../this-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
