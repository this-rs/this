[package]
name = "this-platform"
version = "0.0.1"
edition = "2024"
authors = ["Riviere Théotime <t@ffs.holdings>"]
license = "MIT OR Apache-2.0"
description = "Platform shell contract for this-rs apps: form factor, window chrome, device cutouts, lifecycle decisions and device capabilities. Pure: no Tauri, no DOM."
repository = "https://github.com/this-rs/this"
keywords = ["platform", "tauri", "mobile", "desktop", "lifecycle"]
categories = ["gui", "wasm"]

# Pure crate, like this-descriptor: NO tokio, axum, tonic, Tauri or DOM. It must compile
# for wasm32-unknown-unknown (the web shell and the front read the same decisions).
[dependencies]
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
