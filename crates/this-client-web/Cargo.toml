[package]
name = "this-client-web"
version = "0.0.1"
edition = "2021"
authors = ["Riviere Théotime <t@ffs.holdings>"]
license = "MIT OR Apache-2.0"
description = "Le client wasm des protocoles d'un serveur this-rs : framing gRPC-Web, protobuf minimal, appels unaires et flux serveur. Ce qu'un front doit réécrire à la main aujourd'hui."
repository = "https://github.com/this-rs/this"
keywords = ["framework", "grpc-web", "wasm", "client"]
categories = ["web-programming"]

# Crate wasm autonome, hors du workspace du framework (même raison que this-ui).
[workspace]

[dependencies]
this-app = { path = "../this-app" }
gloo-net = { version = "0.6", features = ["http", "json"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "ReadableStream", "ReadableStreamDefaultReader"] }
