[package]
name = "this-module-harness-web"
version = "0.0.1"
edition = "2024"
authors = ["Riviere Théotime <t@ffs.holdings>"]
license = "MIT OR Apache-2.0"
description = "The browser Executor of a this-rs module harness: WebAssembly.instantiate, host calls and effect trace."
repository = "https://github.com/this-rs/this"
keywords = ["framework", "module", "wasm", "executor"]
categories = ["wasm"]

# Crate wasm uniquement : son propre workspace, comme this-ui et this-vfs-web.
[workspace]

[dependencies]
this-module-harness = { version = "0.0.1", path = "../this-module-harness" }
this-module-lang = { version = "0.0.1", path = "../this-module-lang", default-features = false }
async-trait = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# Réécrire le binaire pour le borner (voir `meter`). `wasm-instrument` (parity-wasm 0.45)
# a été essayé puis écarté : il refuse l'opcode 0xFC (bulk-memory, conversions
# saturantes) que `rustc` émet désormais par défaut, donc tout vrai module Rust.
wasmparser = { version = "0.263", default-features = false, features = ["std", "simd"] }
wasm-encoder = { version = "0.263", default-features = false, features = ["std", "wasmparser"] }

[dev-dependencies]
# Un module de test s'écrit en texte : `wat` l'assemble, en natif comme en wasm32.
wat = "1.263.0"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Natif seulement : exécuter le binaire instrumenté pour prouver qu'il s'arrête seul.
wasmi = "2.0.0"
