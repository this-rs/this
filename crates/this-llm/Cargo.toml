[package]
name = "this-llm"
version = "0.0.1"
edition = "2024"
authors = ["Riviere Théotime <t@ffs.holdings>"]
license = "MIT OR Apache-2.0"
description = "The completion contract and the provider description of a this-rs app: base, model, and a credential REFERENCE — never a value. Describes, does not transport."
repository = "https://github.com/this-rs/this"
keywords = ["framework", "llm", "provider", "wasm"]
categories = ["wasm"]

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
