[package]
name = "this-forge"
version = "0.1.0"
edition = "2024"
authors = ["Riviere Théotime <t@ffs.holdings>"]
license = "MIT OR Apache-2.0"
description = "Le service de build des modules this : compile du Rust en wasm pour des comptes (invitation, quotas, signature Ed25519). Bêta fermée."
repository = "https://github.com/this-rs/this"
publish = false

[lib]
name = "this_forge"
path = "src/lib.rs"

[[bin]]
name = "this-forge"
path = "src/main.rs"

[dependencies]
# La forge mange son propre framework : serveur, stockage (mémoire / LMDB),
# entités et descripteur viennent de `this`.
this-rs = { path = "../..", features = ["lmdb"] }
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
base64 = "0.22"
tempfile = "3"
# Écart assumé au « rien n'est réimplémenté » : le STS du framework vit derrière
# la feature `wami` (dépôts git, IAM complet). La forge n'a besoin que d'un JWT
# Ed25519 et d'un hachage de mot de passe : voir README, section « Écarts ».
jsonwebtoken = "9"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
argon2 = { version = "0.5", features = ["std"] }
# Déjà dans le lock (via wasmi) : lecture des sections import/export.
wasmparser = "0.228"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Assemble de vrais binaires wasm pour les tests du contrôle ABI et du runner.
wat = "1.263.0"
