[package]
name = "this-ui"
version = "0.0.1"
edition = "2021"
authors = ["Riviere Théotime <t@ffs.holdings>"]
license = "MIT OR Apache-2.0"
description = "Les composants d'interface d'une app this-rs en Leptos : démarrage, panneau, réglages, habillage, avis. Consommés par un front wasm, jamais compilés pour l'hôte."
repository = "https://github.com/this-rs/this"
keywords = ["framework", "leptos", "ui", "wasm"]
categories = ["web-programming"]

# Crate wasm autonome, hors du workspace du framework : il ne doit pas imposer
# Leptos à un backend qui n'en a pas besoin (même raison que `this-shell-tauri`
# et son propre workspace).
[workspace]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
# Les contrats de l'app et le contrat du module viennent du framework.
this-app = { path = "../this-app" }
this-descriptor = { path = "../this-descriptor" }
this-platform = { path = "../this-platform" }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["EventTarget", "Event", "Window", "Document", "Element", "HtmlElement", "CssStyleDeclaration", "NodeList", "MediaQueryList", "Screen", "Storage", "Navigator", "DomRect"] }
