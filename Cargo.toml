[package]
name = "this-rs"
version = "0.0.9"
edition = "2024"
authors = ["Riviere Théotime <t@ffs.holdings>"]
license = "MIT OR Apache-2.0"
description = "Framework for building complex multi-entity REST and GraphQL APIs with many relationships"
repository = "https://github.com/this-rs/this"
keywords = ["entity", "relationship", "rest", "graphql", "api"]
categories = ["web-programming", "web-programming::http-server", "database"]
readme = "README.md"

[workspace]
members = [".", "crates/this-descriptor"]
resolver = "3"

[dependencies]
# Module descriptor (types, pure engines, error table) shared with this-cli and wasm32
# fronts. `version` + `path`: publishable (this-descriptor is published BEFORE this-rs).
this-descriptor = { version = "0.1", path = "crates/this-descriptor", features = ["yaml", "pattern", "http"] }
# Atomic publication of the host catalog snapshot (readers never lock).
arc-swap = "1"
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
futures = "0.3"

# Web framework
axum = { version = "0.8", features = ["macros", "ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Database (optional features)
sqlx = { version = "0.9", optional = true, default-features = false }
mongodb = { version = "3", optional = true }
neo4rs = { version = "0.8", optional = true }
scylla = { version = "1.4", optional = true }
heed = { version = "0.22", optional = true }
bincode = { version = "2", optional = true, features = ["serde"] }

# DynamoDB support
aws-sdk-dynamodb = { version = "1.93", optional = true }
serde_dynamo = { version = "4.0", optional = true }

# UUID and datetime
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Template engine (for map operator in event flows)
tera = "1"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Identité d'entité engine-agnostique (`core::identity`) : l'id dérivé est une
# clé PERMANENTE, donc une fonction de hachage stable et résistante à la
# collision adverse est requise (un `qualified_name` vient d'un client).
# Dépendance NON optionnelle à dessein : un `sha2` optionnel produirait deux
# espaces d'identité selon les features de build — le pire défaut possible pour
# un identifiant.
sha2 = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Validation
regex = "1.10"

# GraphQL support (optional)
async-graphql = { version = "7", optional = true }
async-graphql-axum = { version = "7", optional = true }
graphql-parser = { version = "0.4", optional = true }

# gRPC support (optional)
tonic = { version = "0.14", optional = true }
tonic-prost = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }
prost-types = { version = "0.14", optional = true }

# Push notifications (optional)
reqwest = { version = "0.13", features = ["json", "stream"], optional = true }
indexmap = "2.13.0"

# Obrain graph database — cognitive graph engine (this-rs/obrain, the
# ultra-benchmarked engine: fastest tested graph DB on LDBC Social Network
# Benchmark in embedded and server configurations). Workspace checkout:
# ~/projects/banc-obrain (github this-rs/obrain). Optional, feature-gated.
#
# `algos` est requis pour DEUX raisons distinctes :
#   1. `obrain-engine::procedures` (le registre des procédures) est gaté
#      derrière cette feature (`obrain-engine/src/lib.rs:44-45`) — sans elle
#      `registre()` n'existe pas, donc le relief ne peut pas se décrire ;
#   2. c'est elle qui apporte pagerank / leiden / articulation_points /
#      strongly_connected_components / spectral (tout
#      `obrain-adapters::plugins::algorithms` est sous ce cfg).
# Le dispatch générique des procédures `CALL` en dépend aussi (cf.
# `cognitive-full = [..., "algos"]` dans obrain-engine).
obrain-engine = { path = "../../banc-obrain-j4/crates/obrain-engine", optional = true, features = ["algos"] }
obrain-common = { path = "../../banc-obrain-j4/crates/obrain-common", optional = true }
obrain-core = { path = "../../banc-obrain-j4/crates/obrain-core", optional = true, default-features = false }
# `obrain-substrate` doit être une dépendance DIRECTE (et non transitive via
# l'engine) dès qu'on nomme ses types : `substrate_handle()` rend un
# `Option<Arc<SubstrateStore>>`, et la couche simpliciale / courbure / énergie
# ne vit que là (`simplex_passes`, `simplex_zone`, `geometric`). Aucune feature.
obrain-substrate = { path = "../../banc-obrain-j4/crates/obrain-substrate", optional = true }
# `obrain-adapters` doit aussi être direct dès qu'on NOMME ses types : le
# registre rend des `ParameterDef` dont le `param_type` est un
# `obrain_adapters::plugins::ParameterType` (re-export `plugins/mod.rs:16`).
# `plugins::traits` n'est PAS gaté par `algos` (seul `plugins::algorithms` l'est),
# donc `default-features = false` suffit ici — les features dont on a besoin
# (`algos`) sont demandées via `obrain-engine`, et l'unification les ramène.
obrain-adapters = { path = "../../banc-obrain-j4/crates/obrain-adapters", optional = true, default-features = false }
# `obrain-reactive` porte les VRAIS types du pont : `MutationBus`, `MutationEvent`,
# `MutationBatch`. Il manquait, et c'est pour ça que `events/bridge/types.rs`
# recopiait des types locaux — recopie qui a DÉJÀ divergé (voir types.rs).
obrain-reactive = { path = "../../banc-obrain-j4/crates/obrain-reactive", optional = true }

# vite-rs — Vite-like static/dev frontend serving reused by the `frontend`
# feature (dev loop + AI bridge + static file rules + guaranteed cache
# freshness). Local checkout: ~/projects/vite-rs (github this-rs/vite-rs).
vite-rs = { path = "../../vite-rs", optional = true }

# WAMI auth (optional, feature-gated)
jsonwebtoken = { version = "9", optional = true }
ed25519-dalek = { version = "2", optional = true, features = ["pkcs8", "pem", "rand_core"] }
base64 = { version = "0.22", optional = true }

# Hachage des mots de passe de l'annuaire persisté (chantier STS-PERSISTANT) :
# argon2id, paramètres par défaut du crate = recommandation OWASP
# (v19, m=19456 KiB, t=2, p=1). Voir storage::annuaire_identites.
argon2 = { version = "0.5", optional = true, features = ["std"] }

[build-dependencies]
tonic-prost-build = { version = "0.14" }

[dev-dependencies]
tokio-test = "0.4"
async-trait = "0.1"
axum-test = "21.1"
reqwest = { version = "0.13", features = ["json"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "mongo", "neo4j", "mysql"] }
tempfile = "3"

[features]
default = ["in-memory"]
in-memory = []
dynamodb = ["aws-sdk-dynamodb", "serde_dynamo"]
postgres = ["sqlx", "sqlx/macros", "sqlx/runtime-tokio", "sqlx/tls-rustls", "sqlx/postgres", "sqlx/uuid", "sqlx/chrono", "sqlx/json", "sqlx/migrate"]
mongodb_backend = ["mongodb"]
neo4j = ["neo4rs"]
scylladb = ["scylla"]
mysql = ["sqlx", "sqlx/macros", "sqlx/runtime-tokio", "sqlx/tls-rustls", "sqlx/mysql", "sqlx/uuid", "sqlx/chrono", "sqlx/json", "sqlx/migrate"]
lmdb = ["heed"]
graphql = ["async-graphql", "async-graphql-axum", "graphql-parser", "this-descriptor/graphql"]
grpc = ["tonic", "tonic-prost", "prost", "prost-types", "this-descriptor/grpc"]
push = ["dep:reqwest"]
# Gestion d'une zone PowerDNS (API HTTP) : délégation DNS de l'exposition.
powerdns = ["dep:reqwest"]
# Rattachement d'un projet existant par HTTP (proxy gardé du binaire
# this-gateway) : un « service » derrière la porte, avec ses refus explicites.
proxy = ["dep:reqwest"]
websocket = []
wami = ["dep:jsonwebtoken", "dep:ed25519-dalek", "dep:base64", "dep:argon2"]
obrain = ["dep:obrain-engine", "dep:obrain-common", "dep:obrain-core", "dep:obrain-substrate", "dep:obrain-adapters", "dep:obrain-reactive"]
# Alias conservé pour compatibilité, mais le relief cognitif n'est PAS branché :
# `core::events::CognitiveSignal` est un vocabulaire propre à this-rs, et le
# moteur cognitif d'obrain (`obrain-cognitive`) n'est pas une dépendance.
obrain-cognitive = ["obrain"]
# vite-rs based SPA frontend hosting (this::server::frontend). Not part of
# `all` because it needs the local vite-rs checkout (path dep), like obrain.
frontend = ["dep:vite-rs"]
all = ["in-memory", "dynamodb", "postgres", "mongodb_backend", "neo4j", "scylladb", "mysql", "lmdb", "graphql", "grpc", "websocket", "push"]

[lib]
name = "this"
path = "src/lib.rs"


[[example]]
name = "domain_harness"
path = "examples/domain_harness.rs"
# L'exemple a besoin du client : sans la feature, il ne doit pas être construit
# par `--all-targets`, sinon un consommateur qui ne l'active pas échoue à la
# compilation d'un exemple qu'il n'utilise pas.
required-features = ["powerdns"]

[[example]]
name = "caddyfile"
path = "examples/caddyfile.rs"
required-features = []
[[example]]
name = "simple_api"
path = "examples/simple_api/main.rs"

[[example]]
name = "full_api"
path = "examples/full_api/main.rs"

[[example]]
name = "descriptor_api"
path = "examples/descriptor_api/main.rs"
required-features = ["graphql", "grpc"]

# Chargement à chaud : un module déclaratif stocké dans un VFS (InMemoryVfs ou
# LocalFsVfs), chargé dans un hôte vivant, servi sur REST/GraphQL/gRPC, puis
# déchargé (404 `this.module.not_found`). Un seul ModuleDescriptor, déclaré une fois.
[[example]]
name = "hot_module"
path = "examples/hot_module/main.rs"
required-features = ["graphql", "grpc"]

[[example]]
name = "microservice"
path = "examples/microservice/main.rs"

[[example]]
name = "microservice_graphql"
path = "examples/microservice/main_graphql.rs"
required-features = ["graphql"]

# Serveur multi-protocoles (REST + GraphQL + gRPC + WebSocket + SSE) au-dessus
# d'un store obrain aletheia (noeuds `Page` / `Problem` / `Lemma` / `Gate`).
# Voir examples/ALETHEIA-SERVER.md pour le runbook de deploiement.
[[example]]
name = "aletheia_server"
path = "examples/aletheia_server.rs"
required-features = ["obrain", "graphql", "grpc", "websocket"]

# Le plus petit serveur qui publie le relief d'obrain sur REST : aucun catalogue
# tenu à la main, le document se décrit depuis le registre du moteur.
[[example]]
name = "graph_relief"
path = "examples/graph_relief.rs"
required-features = ["obrain"]

# Contrat de latence : ce que coûte chaque surface, in-process et HTTP.
[[example]]
name = "latency_contract"
path = "examples/latency_contract.rs"
required-features = ["obrain"]

# Banc : ce que coûte une décision d'autorisation — traversée contre
# matérialisation indexée (le chiffre qui porte le chantier IAM).
[[example]]
name = "iam_bench"
path = "examples/iam_bench.rs"
required-features = ["obrain"]

# Diagnostic : cette base obrain est-elle adoptable par les services de
# stockage, ou seulement lisible en relief ? (la distinction qui décide de ce
# que this-rs peut exposer d'une base qu'il n'a pas écrite)
[[example]]
name = "adopt_obrain_base"
path = "examples/adopt_obrain_base.rs"
required-features = ["obrain"]

# Banc : ce que coûte la publication du relief (chemin constant vs balayage
# simplex), et la bascule d'espace. `--release` pour des chiffres utilisables.
[[example]]
name = "relief_bench"
path = "examples/relief_bench.rs"
required-features = ["obrain"]

[[example]]
name = "canvas_inference"
path = "examples/canvas_inference.rs"
required-features = ["obrain"]

# Deux exemples qui parlent obrain par ses types (`ObrainStore`,
# `ObrainDataService`, `ObrainLinkService`) : sans la feature, ils ne
# compilent pas — et `cargo test` construit les exemples. Déclarés ici
# **uniquement** pour porter `required-features`, sans quoi un `cargo test`
# par défaut échouait avant même d'exécuter un test.
[[example]]
name = "weave_pilot"
path = "examples/weave_pilot.rs"
required-features = ["obrain"]

[[example]]
name = "weave_bench"
path = "examples/weave_bench.rs"
required-features = ["obrain"]

# ── Bancs d'essai ─────────────────────────────────────────────────────────
# `harness = false` : le banc a son propre harnais (échauffement, N tours,
# médiane), sans dépendance de mesure — le dépôt construit hors ligne.
[[bench]]
name = "scope_bench"
path = "benches/scope_bench.rs"
harness = false
required-features = ["obrain"]

# Validation par descripteur (RFC module-descriptor §7.1) : `engine::validate::apply`
# est sur le chemin de toute écriture d'une entité décrite.
[[bench]]
name = "validate_bench"
path = "benches/validate_bench.rs"
harness = false

# La passerelle IAM devant les stores obrain (chantier PASSERELLE-THIS-RS) :
# STS (émission + validation Ed25519), refus par défaut (la faille 4-segments
# meurt aux deux étages), stores en LECTURE SEULE montés sous /stores/{nom}.
[[bin]]
name = "this-gateway"
path = "src/bin/this-gateway.rs"
required-features = ["obrain", "wami"]
